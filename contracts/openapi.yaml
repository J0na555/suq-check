openapi: 3.1.0
info:
  title: SuqCheck API
  description: Evidence-backed price estimates for packaged household essentials in
    Ethiopia.
  version: 0.1.0
paths:
  /healthz:
    get:
      tags:
      - system
      summary: Health
      operationId: health_healthz_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
  /api/pulse:
    get:
      tags:
      - market
      summary: Get Pulse
      operationId: get_pulse_api_pulse_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PulseResponse'
  /api/products:
    get:
      tags:
      - products
      summary: List Products
      operationId: list_products_api_products_get
      parameters:
      - name: q
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            maxLength: 100
          - type: 'null'
          title: Q
      - name: category
        in: query
        required: false
        schema:
          anyOf:
          - enum:
            - cooking_oil
            - sugar
            - rice
            - flour
            - salt
            - pasta
            - coffee
            - tea
            - milk
            - soap
            - detergent
            - toothpaste
            - shampoo
            - bottled_water
            type: string
          - type: 'null'
          title: Category
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 100
          minimum: 1
          default: 20
          title: Limit
      - name: offset
        in: query
        required: false
        schema:
          type: integer
          minimum: 0
          default: 0
          title: Offset
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductListResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/products/{product_id}:
    get:
      tags:
      - products
      summary: Get Product
      operationId: get_product_api_products__product_id__get
      parameters:
      - name: product_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Product Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductDetail'
        '404':
          description: No product with this id has a priced estimate.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/products/{product_id}/stores:
    get:
      tags:
      - products
      summary: List Product Stores
      operationId: list_product_stores_api_products__product_id__stores_get
      parameters:
      - name: product_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Product Id
      - name: latitude
        in: query
        required: false
        schema:
          anyOf:
          - type: number
            maximum: 90
            minimum: -90
          - type: 'null'
          title: Latitude
      - name: longitude
        in: query
        required: false
        schema:
          anyOf:
          - type: number
            maximum: 180
            minimum: -180
          - type: 'null'
          title: Longitude
      - name: radius_m
        in: query
        required: false
        schema:
          type: integer
          maximum: 50000
          minimum: 100
          default: 5000
          title: Radius M
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NearbyStoresResponse'
        '404':
          description: No product with this id has a priced estimate.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/stores/{store_id}:
    get:
      tags:
      - stores
      summary: Get Store
      operationId: get_store_api_stores__store_id__get
      parameters:
      - name: store_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Store Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StoreDetail'
        '404':
          description: No store with this id.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/evidence:
    get:
      tags:
      - evidence
      summary: List Evidence
      operationId: list_evidence_api_evidence_get
      parameters:
      - name: status
        in: query
        required: false
        schema:
          anyOf:
          - enum:
            - accepted
            - pending
            - rejected
            type: string
          - type: 'null'
          description: Filter by the gate decision.
          title: Status
        description: Filter by the gate decision.
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 100
          minimum: 1
          default: 20
          title: Limit
      - name: offset
        in: query
        required: false
        schema:
          type: integer
          minimum: 0
          default: 0
          title: Offset
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EvidenceLogResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/evidence/receipt:
    post:
      tags:
      - evidence
      summary: Upload Receipt
      operationId: upload_receipt_api_evidence_receipt_post
      parameters:
      - name: X-Device-Id
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Anonymous device identifier used for rate limiting.
          title: X-Device-Id
        description: Anonymous device identifier used for rate limiting.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Body_upload_receipt_api_evidence_receipt_post'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReceiptUploadResponse'
        '429':
          description: The per-device or per-network upload limit was reached. The
            `Retry-After` header carries the wait in seconds.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '413':
          description: The image is larger than 8MB.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '415':
          description: The image must be one of image/jpeg, image/png, image/webp.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '502':
          description: The image could not be read; ask the shopper to retake it.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/evidence/price-list:
    post:
      tags:
      - evidence
      summary: Upload Price List
      operationId: upload_price_list_api_evidence_price_list_post
      parameters:
      - name: X-Device-Id
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Anonymous device identifier used for rate limiting.
          title: X-Device-Id
        description: Anonymous device identifier used for rate limiting.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Body_upload_price_list_api_evidence_price_list_post'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PriceListUploadResponse'
        '429':
          description: The per-device or per-network upload limit was reached. The
            `Retry-After` header carries the wait in seconds.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '413':
          description: The image is larger than 8MB.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '415':
          description: The image must be one of image/jpeg, image/png, image/webp.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '502':
          description: The image could not be read; ask the shopper to retake it.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: The report names a store that does not exist.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/evidence/shelf:
    post:
      tags:
      - evidence
      summary: Upload Shelf Photo
      operationId: upload_shelf_photo_api_evidence_shelf_post
      parameters:
      - name: X-Device-Id
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Anonymous device identifier used for rate limiting.
          title: X-Device-Id
        description: Anonymous device identifier used for rate limiting.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Body_upload_shelf_photo_api_evidence_shelf_post'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShelfUploadResponse'
        '429':
          description: The per-device or per-network upload limit was reached. The
            `Retry-After` header carries the wait in seconds.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '413':
          description: The image is larger than 8MB.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '415':
          description: The image must be one of image/jpeg, image/png, image/webp.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '502':
          description: The image could not be read; ask the shopper to retake it.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: The tagged product is not in the catalog, so its price cannot
            be recorded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/evidence/manual:
    post:
      tags:
      - evidence
      summary: Submit Manual Evidence
      operationId: submit_manual_evidence_api_evidence_manual_post
      parameters:
      - name: X-Device-Id
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Anonymous device identifier used for rate limiting.
          title: X-Device-Id
        description: Anonymous device identifier used for rate limiting.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ManualEvidenceRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ManualEvidenceResponse'
        '429':
          description: The per-device or per-network upload limit was reached. The
            `Retry-After` header carries the wait in seconds.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: The report names a product or store that does not exist.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/scan/identify:
    post:
      tags:
      - scan
      summary: Identify Product
      operationId: identify_product_api_scan_identify_post
      parameters:
      - name: X-Device-Id
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Anonymous device identifier used for rate limiting.
          title: X-Device-Id
        description: Anonymous device identifier used for rate limiting.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Body_identify_product_api_scan_identify_post'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductIdentification'
        '429':
          description: The per-device or per-network upload limit was reached. The
            `Retry-After` header carries the wait in seconds.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '413':
          description: The image is larger than 8MB.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '415':
          description: The image must be one of image/jpeg, image/png, image/webp.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '502':
          description: The image could not be read; ask the shopper to retake it.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/analytics/trends:
    get:
      tags:
      - analytics
      summary: Get Trends
      operationId: get_trends_api_analytics_trends_get
      parameters:
      - name: period_days
        in: query
        required: false
        schema:
          type: integer
          maximum: 90
          minimum: 2
          default: 7
          title: Period Days
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TrendsResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/analytics/unit-economics:
    get:
      tags:
      - analytics
      summary: Get Unit Economics
      operationId: get_unit_economics_api_analytics_unit_economics_get
      parameters:
      - name: period_days
        in: query
        required: false
        schema:
          type: integer
          maximum: 90
          minimum: 1
          default: 30
          title: Period Days
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnitEconomicsResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
components:
  schemas:
    Body_identify_product_api_scan_identify_post:
      properties:
        image:
          type: string
          contentMediaType: application/octet-stream
          title: Image
          description: JPEG, PNG, or WebP product image.
      type: object
      required:
      - image
      title: Body_identify_product_api_scan_identify_post
    Body_upload_price_list_api_evidence_price_list_post:
      properties:
        image:
          type: string
          contentMediaType: application/octet-stream
          title: Image
          description: JPEG, PNG, or WebP posted price-list image.
        store_id:
          type: string
          format: uuid
          title: Store Id
          description: Store where the price list was photographed.
      type: object
      required:
      - image
      - store_id
      title: Body_upload_price_list_api_evidence_price_list_post
    Body_upload_receipt_api_evidence_receipt_post:
      properties:
        image:
          type: string
          contentMediaType: application/octet-stream
          title: Image
          description: JPEG, PNG, or WebP receipt image.
      type: object
      required:
      - image
      title: Body_upload_receipt_api_evidence_receipt_post
    Body_upload_shelf_photo_api_evidence_shelf_post:
      properties:
        image:
          type: string
          contentMediaType: application/octet-stream
          title: Image
          description: JPEG, PNG, or WebP shelf photo.
      type: object
      required:
      - image
      title: Body_upload_shelf_photo_api_evidence_shelf_post
    ConfidenceBreakdown:
      properties:
        score:
          type: integer
          maximum: 100.0
          minimum: 0.0
          title: Score
        band:
          type: string
          enum:
          - high
          - medium
          - low
          title: Band
        factors:
          items:
            $ref: '#/components/schemas/ConfidenceFactor'
          type: array
          title: Factors
        capped:
          type: boolean
          title: Capped
          default: false
        cap_reason:
          anyOf:
          - type: string
          - type: 'null'
          title: Cap Reason
      type: object
      required:
      - score
      - band
      - factors
      title: ConfidenceBreakdown
    ConfidenceFactor:
      properties:
        name:
          type: string
          enum:
          - volume
          - agreement
          - freshness
          - diversity
          title: Name
        score:
          type: number
          maximum: 1.0
          minimum: 0.0
          title: Score
        weight:
          type: number
          maximum: 1.0
          minimum: 0.0
          title: Weight
        detail:
          type: string
          title: Detail
      type: object
      required:
      - name
      - score
      - weight
      - detail
      title: ConfidenceFactor
    CostBenchmark:
      properties:
        id:
          type: string
          title: Id
        label:
          type: string
          title: Label
        min_etb:
          type: number
          title: Min Etb
        max_etb:
          type: number
          title: Max Etb
        unit:
          type: string
          title: Unit
          description: What one unit of this benchmark buys.
        source:
          type: string
          title: Source
      type: object
      required:
      - id
      - label
      - min_etb
      - max_etb
      - unit
      - source
      title: CostBenchmark
    ErrorResponse:
      properties:
        detail:
          type: string
          title: Detail
      type: object
      required:
      - detail
      title: ErrorResponse
      description: Every error this API returns, including 429, has this body.
    EvidenceDecision:
      properties:
        id:
          type: string
          format: uuid
          title: Id
        product_id:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          title: Product Id
        product_name:
          type: string
          title: Product Name
        price_etb:
          type: number
          exclusiveMinimum: 0.0
          title: Price Etb
        source_type:
          type: string
          enum:
          - partner
          - receipt
          - scrape
          - store_visit
          - shelf_photo
          - community
          title: Source Type
        status:
          type: string
          enum:
          - accepted
          - pending
          - rejected
          title: Status
        reason:
          type: string
          title: Reason
      type: object
      required:
      - id
      - product_name
      - price_etb
      - source_type
      - status
      - reason
      title: EvidenceDecision
    EvidenceLogItem:
      properties:
        id:
          type: string
          format: uuid
          title: Id
        product_name:
          type: string
          title: Product Name
        store_name:
          anyOf:
          - type: string
          - type: 'null'
          title: Store Name
        price_etb:
          type: number
          exclusiveMinimum: 0.0
          title: Price Etb
        source_type:
          type: string
          enum:
          - partner
          - receipt
          - scrape
          - store_visit
          - shelf_photo
          - community
          title: Source Type
        status:
          type: string
          enum:
          - accepted
          - pending
          - rejected
          title: Status
        rejection_reason:
          anyOf:
          - type: string
          - type: 'null'
          title: Rejection Reason
        observed_at:
          type: string
          format: date-time
          title: Observed At
        created_at:
          type: string
          format: date-time
          title: Created At
      type: object
      required:
      - id
      - product_name
      - price_etb
      - source_type
      - status
      - observed_at
      - created_at
      title: EvidenceLogItem
    EvidenceLogResponse:
      properties:
        total:
          type: integer
          minimum: 0.0
          title: Total
        limit:
          type: integer
          minimum: 1.0
          title: Limit
        offset:
          type: integer
          minimum: 0.0
          title: Offset
        items:
          items:
            $ref: '#/components/schemas/EvidenceLogItem'
          type: array
          title: Items
      type: object
      required:
      - total
      - limit
      - offset
      - items
      title: EvidenceLogResponse
    ExtractedLineItem:
      properties:
        raw_text:
          type: string
          title: Raw Text
        quantity:
          type: number
          exclusiveMinimum: 0.0
          title: Quantity
          default: 1
        unit_price_etb:
          type: number
          exclusiveMinimum: 0.0
          title: Unit Price Etb
        total_price_etb:
          type: number
          exclusiveMinimum: 0.0
          title: Total Price Etb
        matched_product_id:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          title: Matched Product Id
        matched_product_name:
          anyOf:
          - type: string
          - type: 'null'
          title: Matched Product Name
        match_confidence:
          type: number
          maximum: 1.0
          minimum: 0.0
          title: Match Confidence
      type: object
      required:
      - raw_text
      - unit_price_etb
      - total_price_etb
      - match_confidence
      title: ExtractedLineItem
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    HealthResponse:
      properties:
        status:
          type: string
          const: ok
          title: Status
        fixtures:
          type: boolean
          title: Fixtures
        checked_at:
          type: string
          format: date-time
          title: Checked At
      type: object
      required:
      - status
      - fixtures
      - checked_at
      title: HealthResponse
    HistoryPoint:
      properties:
        day:
          type: string
          format: date
          title: Day
        price_etb:
          type: number
          exclusiveMinimum: 0.0
          title: Price Etb
        evidence_count:
          type: integer
          minimum: 0.0
          title: Evidence Count
      type: object
      required:
      - day
      - price_etb
      - evidence_count
      title: HistoryPoint
    ManualEvidenceRequest:
      properties:
        product_id:
          type: string
          format: uuid
          title: Product Id
        store_id:
          type: string
          format: uuid
          title: Store Id
        price_etb:
          type: number
          exclusiveMinimum: 0.0
          title: Price Etb
        observed_at:
          type: string
          format: date-time
          title: Observed At
        source_type:
          type: string
          enum:
          - store_visit
          - community
          title: Source Type
          default: community
      type: object
      required:
      - product_id
      - store_id
      - price_etb
      - observed_at
      title: ManualEvidenceRequest
    ManualEvidenceResponse:
      properties:
        decision:
          $ref: '#/components/schemas/EvidenceDecision'
      type: object
      required:
      - decision
      title: ManualEvidenceResponse
    NearbyStorePrice:
      properties:
        id:
          type: string
          format: uuid
          title: Id
        name:
          type: string
          title: Name
        district:
          type: string
          title: District
        kind:
          type: string
          enum:
          - supermarket
          - shop
          - online
