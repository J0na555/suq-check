services:
  - type: web
    name: suq-check-api
    runtime: python
    plan: free
    region: oregon
    rootDir: backend
    buildCommand: pip install -e .
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      # asyncpg, pydantic-core, and uvloop all publish cp313 wheels; a newer
      # interpreter would build them from source during every deploy.
      - key: PYTHON_VERSION
        value: 3.13.5
      - key: ENVIRONMENT
        value: production
      - key: USE_FIXTURES
        value: "false"
      - key: CORS_ORIGINS
        value: "*"
      - key: DATABASE_URL
        sync: false
      - key: MIGRATION_DATABASE_URL
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      # Priced in the unit-economics / cost model at $0.30 / $2.50 per 1M tokens.
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
