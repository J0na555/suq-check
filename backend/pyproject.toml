[project]
name = "suqcheck-api"
version = "0.1.0"
description = "Evidence-backed pricing intelligence API"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.116",
    "pydantic-settings>=2.10",
    "python-multipart>=0.0.20",
    "uvicorn[standard]>=0.35",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.28",
    "pytest>=8.4",
    "pyyaml>=6.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

